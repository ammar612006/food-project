<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard Full</title>
<style>
:root{
  --primary-green:#22c55e;
  --primary-hover:#16a34a;
  --text-dark:#1f2937;
  --muted:#6b7280;
  --card-bg:#fff;
}
body, html{margin:0;padding:0;font-family:Arial,sans-serif;background:#f3f4f6;height:100%;}
.container{display:flex;height:100vh;align-items:center;justify-content:center;}
.form-box{background:#fff;padding:30px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.08);width:360px;text-align:center;}
.form-box h2{margin-bottom:20px;color:var(--text-dark);}
input, select, textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #e5e7eb;border-radius:10px;font-size:16px;}
button{width:100%;padding:12px;margin-top:12px;border:none;border-radius:10px;background:var(--primary-green);color:#fff;font-size:16px;cursor:pointer;font-weight:700;}
button:hover{background:var(--primary-hover);}
.toggle-link{margin-top:10px;font-size:14px;color:var(--primary-green);cursor:pointer;}

/* Dashboard */
#dashboard{display:none;flex:1;height:100%;overflow:auto;}
.dashboard-container{display:flex;height:100vh;}
.sidebar{
  width:260px;background:var(--primary-green);color:white;display:flex;flex-direction:column;padding-top:25px;
}
.sidebar h2{text-align:center;margin-bottom:25px;font-size:22px;}
.sidebar button{background:none;border:none;color:white;padding:15px;text-align:left;font-size:18px;cursor:pointer;transition:0.3s;}
.sidebar button:hover{background:rgba(0,0,0,0.15);}
.main{flex:1;padding:30px;overflow-y:auto;}
h1{text-align:center;font-size:26px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:25px;}
.card{background:var(--card-bg);border-radius:10px;padding:20px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.15);}
.card button{background:var(--primary-green);border:none;color:white;padding:10px 16px;border-radius:6px;margin-top:12px;cursor:pointer;}
.card button:hover{background:var(--primary-hover);}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ccc;padding:10px;text-align:center;}
th{background:var(--primary-green);color:white;}
.panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 6px 18px rgba(0,0,0,.08);}
form{display:flex;flex-direction:column;gap:12px;max-width:450px;margin:auto;}
input, select, textarea{padding:10px;border:1px solid #ccc;border-radius:6px;font-size:16px;}
button.submit-btn{background:var(--primary-green);color:white;padding:12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;}
button.submit-btn:hover{background:var(--primary-hover);}
</style>
</head>
<body>

<!-- Auth Forms -->
<div id="auth-container" class="container">
  <div id="login-box" class="form-box">
    <h2>Admin Login</h2>
    <input type="text" id="login-username" placeholder="Username or Email">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="toggle-link" onclick="toggleForm('register')">Don't have an account? Register</div>
  </div>

  <div id="register-box" class="form-box" style="display:none;">
    <h2>Admin Registration</h2>
    <input type="text" id="reg-username" placeholder="Username">
    <input type="email" id="reg-email" placeholder="Email">
    <input type="password" id="reg-password" placeholder="Password">
    <button onclick="register()">Register</button>
    <div class="toggle-link" onclick="toggleForm('login')">Already have an account? Login</div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="dashboard-container">
    <div class="sidebar">
      <h2>Admin Dashboard</h2>
      <button onclick="loadSection('dashboardContent')">Dashboard</button>
      <button onclick="loadSection('manageDonations')">Manage Donations</button>
      <button onclick="loadSection('manageRequests')">Manage Requests</button>
      <button onclick="loadSection('trackDeliveries')">Track Deliveries</button>
      <button onclick="loadSection('volunteers')">Volunteer Management</button>
      <button onclick="loadSection('users')">User Management</button>
      <button onclick="loadSection('reports')">Reports & Analytics</button>
      <button onclick="loadSection('settings')">Settings</button>
      <button onclick="logout()">Sign Out</button>
    </div>
    <div class="main" id="section-content">
      <!-- Content loads here -->
    </div>
  </div>
</div>

<script>
// Users & Data storage
let admins = JSON.parse(localStorage.getItem('admins')||'[]');
let donations = JSON.parse(localStorage.getItem('donations')||'[]');
let requests = JSON.parse(localStorage.getItem('requests')||'[]');
let volunteers = JSON.parse(localStorage.getItem('volunteers')||'[]');
let users = JSON.parse(localStorage.getItem('users')||'[]');

function toggleForm(form){
  document.getElementById('login-box').style.display=form==='login'?'block':'none';
  document.getElementById('register-box').style.display=form==='register'?'block':'none';
}

function register(){
  const username=document.getElementById('reg-username').value;
  const email=document.getElementById('reg-email').value;
  const password=document.getElementById('reg-password').value;
  if(!username||!email||!password){alert('Fill all fields'); return;}
  admins.push({username,email,password});
  localStorage.setItem('admins', JSON.stringify(admins));
  alert('Registration successful');
  toggleForm('login');
}

function login(){
  const username=document.getElementById('login-username').value;
  const password=document.getElementById('login-password').value;
  const found=admins.find(u=>(u.username===username||u.email===username)&&u.password===password);
  if(found){
    document.getElementById('auth-container').style.display='none';
    document.getElementById('dashboard').style.display='block';
    loadSection('dashboardContent');
  } else {alert('Invalid credentials');}
}

function logout(){
  if(confirm('Are you sure you want to logout?')){
    location.reload();
  }
}

// Dashboard content loader
function loadSection(section){
  const main = document.getElementById('section-content');

  if(section==='dashboardContent'){
    main.innerHTML=`
      <h1>Main Dashboard</h1>
      <div class="cards">
        <div class="card"><h3>Total Donations</h3><p>${donations.length}</p></div>
        <div class="card"><h3>Total Requests</h3><p>${requests.length}</p></div>
        <div class="card"><h3>Active Volunteers</h3><p>${volunteers.length}</p></div>
      </div>`;
  }

  else if(section==='manageDonations'){
    main.innerHTML=`<h1>All Donations</h1>
      <div class="panel">
        <table>
          <thead><tr><th>Item</th><th>Qty</th><th>Donor</th></tr></thead>
          <tbody>${donations.map(d=>`<tr><td>${d.item}</td><td>${d.qty}</td><td>${d.donor}</td></tr>`).join('')}</tbody>
        </table>
      </div>`;
  }

  else if(section==='manageRequests'){
    main.innerHTML=`<h1>Manage Requests</h1>
      <div class="panel">
        <table>
          <thead><tr><th>ID</th><th>Requester</th><th>Item</th><th>Qty</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>${requests.map((r,i)=>`<tr>
            <td>${i+1}</td><td>${r.name}</td><td>${r.type}</td><td>${r.qty}</td><td>${r.status}</td>
            <td><button onclick="approveRequest(${i})">Approve</button></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>`;
  }

  else if(section==='trackDeliveries'){
    main.innerHTML=`<h1>Track Deliveries</h1>
      <div class="panel">
        <table>
          <thead><tr><th>ID</th><th>Item</th><th>Qty</th><th>Status</th></tr></thead>
          <tbody>${requests.map((r,i)=>`<tr><td>${i+1}</td><td>${r.type}</td><td>${r.qty}</td><td>${r.status}</td></tr>`).join('')}</tbody>
        </table>
      </div>`;
  }

  else if(section==='volunteers'){
    main.innerHTML=`<h1>Volunteer Management</h1>
      <div class="panel">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Area</th></tr></thead>
          <tbody>${volunteers.map((v,i)=>`<tr><td>${i+1}</td><td>${v.name}</td><td>${v.phone}</td><td>${v.area}</td></tr>`).join('')}</tbody>
        </table>
        <hr>
        <h3>Assign Volunteer</h3>
        <form onsubmit="event.preventDefault();assignVolunteer();">
          <input id="volName" placeholder="Name">
          <input id="volPhone" placeholder="Phone">
          <input id="volArea" placeholder="Area">
          <button class="submit-btn">Add Volunteer</button>
        </form>
      </div>`;
  }

  else if(section==='users'){
    main.innerHTML=`<h1>User Management</h1>
      <div class="panel">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th></tr></thead>
          <tbody>${users.map((u,i)=>`<tr><td>${i+1}</td><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td></tr>`).join('')}</tbody>
        </table>
      </div>`;
  }

  else if(section==='reports'){
    main.innerHTML=`<h1>Reports & Analytics</h1>
      <div class="cards">
        <div class="card"><h3>Total Donations</h3><p>${donations.length}</p></div>
        <div class="card"><h3>Requests Fulfilled</h3><p>${requests.filter(r=>r.status==='Approved').length}</p></div>
        <div class="card"><h3>Active Volunteers</h3><p>${volunteers.length}</p></div>
      </div>`;
  }

  else if(section==='settings'){
    main.innerHTML=`<h1>Settings</h1>
      <form onsubmit="event.preventDefault(); alert('Settings saved!');">
        <input placeholder="Organization Name">
        <input placeholder="Default City/Area">
        <input type="email" placeholder="Notification Email">
        <button class="submit-btn">Save Settings</button>
      </form>`;
  }
}

// Actions
function approveRequest(index){requests[index].status='Approved';saveData();loadSection('manageRequests');}
function assignVolunteer(){
  const name=document.getElementById('volName').value;
  const phone=document.getElementById('volPhone').value;
  const area=document.getElementById('volArea').value;
  if(!name||!phone||!area){alert('Fill all fields'); return;}
  volunteers.push({name,phone,area});
  saveData();
  alert('Volunteer added!');
  loadSection('volunteers');
}
function saveData(){
  localStorage.setItem('donations',JSON.stringify(donations));
  localStorage.setItem('requests',JSON.stringify(requests));
  localStorage.setItem('volunteers',JSON.stringify(volunteers));
  localStorage.setItem('users',JSON.stringify(users));
}
</script>

</body>
</html>
